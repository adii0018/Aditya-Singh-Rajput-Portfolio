<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AEBB" />
      <stop offset="70%" stop-color="#00838D" />
      <stop offset="100%" stop-color="#031211" />
    </radialGradient>
    <clipPath id="eyeClip">
      <path d="M 1 32 Q 32 6 63 32 Q 32 58 1 32 Z" />
    </clipPath>
    <!-- Drop shadow filter for floating eye on transparent bg -->
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#00AEBB" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Eye Shape Base with subtle glow (Maximized size on transparent bg) -->
  <path d="M 1 32 Q 32 6 63 32 Q 32 58 1 32 Z" fill="#031211" stroke="#00AEBB" stroke-width="3" filter="url(#eyeGlow)" />

  <!-- Sclera and Iris Inside Clip -->
  <g clip-path="url(#eyeClip)">
    <!-- Sclera (Warm Ivory) -->
    <rect x="0" y="0" width="64" height="64" fill="#E8E4D3" />

    <!-- Corner subtle woodcut shading -->
    <path d="M 1 32 Q 16 18 20 32 Q 16 46 1 32 Z" fill="#031211" opacity="0.16" />
    <path d="M 63 32 Q 48 18 44 32 Q 48 46 63 32 Z" fill="#031211" opacity="0.16" />

    <!-- Iris (Electric Teal, Radius 21) -->
    <circle cx="32" cy="32" r="21" fill="url(#irisGrad)" />

    <!-- Sunburst Aperture Rays for mechanical definition -->
    <g stroke="#E8E4D3" stroke-width="1.2" stroke-opacity="0.65">
      <line x1="32" y1="21" x2="32" y2="12" />
      <line x1="32" y1="43" x2="32" y2="52" />
      <line x1="21" y1="32" x2="12" y2="32" />
      <line x1="43" y1="32" x2="52" y2="32" />
      <line x1="24.2" y1="24.2" x2="17.8" y2="17.8" />
      <line x1="39.8" y1="39.8" x2="46.2" y2="46.2" />
      <line x1="24.2" y1="39.8" x2="17.8" y2="46.2" />
      <line x1="39.8" y1="24.2" x2="46.2" y2="17.8" />
    </g>

    <!-- Inner Concentric Ring -->
    <circle cx="32" cy="32" r="14" fill="none" stroke="#D9FF5C" stroke-width="1.0" stroke-opacity="0.75" />

    <!-- Pupil -->
    <circle cx="32" cy="32" r="9.5" fill="#031211" />

    <!-- Catchlight / Reflection -->
    <circle cx="27.5" cy="27.5" r="3.5" fill="#FFFFFF" />
    <circle cx="36.5" cy="36.5" r="1.6" fill="#D9FF5C" opacity="0.9" />
  </g>
</svg>
